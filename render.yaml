# Blueprint Render: un servizio web + un database Postgres.
# Su Render: New > Blueprint, colleghi il repo e legge questo file.
services:
  - type: web
    name: mykidacademy
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mykidacademy-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NOME
        sync: false

databases:
  - name: mykidacademy-db
    databaseName: mykidacademy
    plan: basic-256mb
    region: frankfurt
